name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/songlass-gradle
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android
        uses: ./.github/actions/setup-android
        with:
          cache: gradle
      - name: Check repository and release guards
        run: |
          python3 -B tools/check_repository_hygiene.py
          python3 -B -m unittest discover -s tools/tests -v
      - name: Run Android host tests, lint and build APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :core:testAndroidHostTest :designsystem:testAndroidHostTest
          :androidApp:lintDebug :androidApp:assembleDebug
      - name: Upload development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Songlass-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Songlass-android-reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            designsystem/build/reports/tests/
            core/build/test-results/
            designsystem/build/test-results/
            androidApp/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
