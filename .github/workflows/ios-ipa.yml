name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'build/ios-ipa-*'
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'tools/build-ios-ipa.sh'
      - 'iosApp/**'
      - 'shared/**'
      - 'core/**'
      - 'designsystem/**'
      - 'theme-liquidglass/**'
      - 'theme-materialglass/**'
      - 'theme-miuix/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Xcode 27.1 and validate the iPhone SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          candidates = []
          for developer in [pathlib.Path('/Applications/Xcode_27.1.app/Contents/Developer')]:
              env = dict(os.environ, DEVELOPER_DIR=str(developer))
              try:
                  xcode = subprocess.check_output(['xcodebuild', '-version'], env=env, text=True)
                  sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], env=env, text=True).strip()
                  version = re.search(r'Xcode\s+(\d+)\.(\d+)', xcode)
                  sdk_version = re.match(r'(\d+)\.(\d+)', sdk)
                  if version and sdk_version and tuple(map(int, version.groups())) == (27, 1) and tuple(map(int, sdk_version.groups())) >= (27, 1):
                      candidates.append((tuple(map(int, version.groups())), developer, sdk))
              except subprocess.CalledProcessError:
                  continue
          if not candidates:
              raise SystemExit('The runner must provide Xcode 27.1 with the iOS 27.1 SDK.')
          _, developer, sdk = max(candidates, key=lambda item: item[0])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={developer}\n')
          print(f'Selected {developer}; iPhoneOS SDK {sdk}')
          PY
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Limit first-build memory and concurrency
        shell: bash
        run: |
          task_gradle_home="$RUNNER_TEMP/songlass-gradle"
          mkdir -p "$task_gradle_home"
          echo "GRADLE_USER_HOME=$task_gradle_home" >> "$GITHUB_ENV"
          cat > "$task_gradle_home/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
      - name: Install SDK required by the shared Gradle project
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build actual iPhone app and package unsigned IPA
        shell: bash
        run: bash tools/build-ios-ipa.sh
      - name: Upload unsigned IPA and build identity
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Songlass-unsigned-iphoneos
          path: |
            build/ios-ipa/run-*/Songlass-unsigned.ipa
            build/ios-ipa/run-*/Songlass-unsigned.ipa.sha256
            build/ios-ipa/run-*/build-info.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Songlass-ios-build-logs
          path: |
            build/ios-ipa/run-*/build.log
            build/ios-ipa/run-*/executable-info.txt
          if-no-files-found: warn
          retention-days: 3
